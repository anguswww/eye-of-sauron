[project]
name = "eye-of-sauron"
version = "0.1.0"
description = "Machine-learning intrusion detection system"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "joblib>=1.6.0",
    "numpy>=2.5.3",
    "pandas>=3.0.5",
    "scapy>=2.7.0",
    "scikit-learn>=1.9.1",
]

[project.scripts]
eye-of-sauron = "eye_of_sauron.cli:main"

[build-system]
requires = ["uv_build>=0.12.0,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
